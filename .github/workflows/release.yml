# Publishes a GitHub release with the macOS and Windows installers and zips attached. Releases come from main only.
# Either push a tag on main (git tag v1.2.0 origin/main && git push origin v1.2.0), or run it from the Actions tab on
# main with a version, which tags main. A version with a hyphen (1.2.0-beta.1) becomes a pre-release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.2.0"
        required: true

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check it is on main
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the Release workflow on main (it was run on $GITHUB_REF)."
            exit 1
          fi
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Releases are tagged from main, after the release pull request from dev is merged."
            exit 1
          fi
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT#v}"; fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$'; then
            echo "::error::\"$v\" is not a version like 1.2.0 or 1.2.0-beta.1"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          notes=$(cat <<'EOF'
          **Downloads**

          - **Isola-macOS.dmg**: macOS 14 or later, Apple silicon and Intel. Open it and drag Isola to Applications. It is not notarised, so the first time, right-click Isola and choose Open. **Isola-macOS.zip** is the same app, zipped.
          - **Isola-Windows-x64-Setup.exe**: Windows 10 and 11 on Intel and AMD PCs.
          - **Isola-Windows-arm64-Setup.exe**: Windows 11 on ARM.

          The Windows installers need no administrator rights and add Isola to the Start menu, with an uninstaller in Settings, Apps. Without installing, **Isola-Windows-x64.zip** and **Isola-Windows-arm64.zip** hold a single self-contained Isola.exe. SmartScreen may warn the first time: choose More info, then Run anyway.
          EOF
          )
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "v$VERSION" dist/*.dmg dist/*.exe dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Isola $VERSION" --notes "$notes" --generate-notes "${flags[@]}"
