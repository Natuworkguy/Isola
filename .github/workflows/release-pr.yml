# main only takes release pull requests from dev. The main ruleset makes this check required.
name: Release PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

jobs:
  source:
    name: Release PR comes from dev
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into main must come from this repository's dev branch (this one is from $HEAD_REPO:$HEAD_REF). Open your pull request against dev instead; see CONTRIBUTING.md."
            exit 1
          fi
          echo "Release pull request from dev."
