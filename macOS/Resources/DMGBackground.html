<!doctype html>
<!--
  The background of the installer's window, 660 by 440 points. dmg_settings.py puts Isola at (170, 220) and
  Applications at (490, 220), 128-point icons. Finder writes their names below them in black, so the page is light.
  Rendered to DMGBackground.png and DMGBackground@2x.png by render_dmg_background.py; rerun that after changing this.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 660px; height: 440px; overflow: hidden; background: #eceef1; }
  body { position: relative; font-family: Inter, sans-serif; color: #0b0b0c; -webkit-font-smoothing: antialiased; }

  /* Pale mist, a shade cooler than Isola's cream icon so it stands out, with the lagoon's teal where Isola is and
     violet where it is going. */
  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(150px 150px at 170px 220px, rgba(20, 184, 166, 0.34), transparent 75%),
      radial-gradient(150px 150px at 490px 220px, rgba(124, 92, 255, 0.24), transparent 75%),
      radial-gradient(300px 220px at 150px 250px, rgba(20, 184, 166, 0.14), transparent 72%),
      radial-gradient(300px 220px at 510px 250px, rgba(124, 92, 255, 0.12), transparent 72%),
      linear-gradient(180deg, #f2f3f5 0%, #e8e9ee 100%);
  }
  .grain { position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: multiply; }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(11, 11, 12, 0.10) 1px, transparent 1.2px);
    background-size: 22px 22px;
    mask-image: radial-gradient(380px 230px at 330px 230px, transparent 40%, #000 100%);
  }

  .title {
    position: absolute; left: 0; right: 0; top: 52px; text-align: center;
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #0b0b0c;
  }

  /* A soft lit floor under each icon. */
  .floor { position: absolute; width: 190px; height: 46px; border-radius: 50%; transform: translate(-50%, -50%); }
  .floor.from { left: 170px; top: 282px; background: radial-gradient(closest-side, rgba(13, 120, 110, 0.32), transparent); }
  .floor.to { left: 490px; top: 282px; background: radial-gradient(closest-side, rgba(90, 60, 220, 0.26), transparent); }

  .arrow { position: absolute; left: 0; top: 0; }

  .hint {
    position: absolute; left: 0; right: 0; top: 366px; text-align: center;
    font-size: 11.5px; font-weight: 500; color: rgba(11, 11, 12, 0.5);
  }
  .hint b { font-weight: 600; color: rgba(11, 11, 12, 0.8); }
  .key {
    display: inline-block; padding: 1px 7px; margin: 0 1px; border-radius: 6px;
    background: #fff; color: rgba(11, 11, 12, 0.8); font-weight: 600;
    box-shadow: 0 0 0 1px rgba(11, 11, 12, 0.12), 0 1px 2px rgba(11, 11, 12, 0.12);
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="dots"></div>
  <svg class="grain" width="660" height="440">
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#noise)"/>
  </svg>

  <div class="title">Install Isola</div>

  <div class="floor from"></div>
  <div class="floor to"></div>

  <svg class="arrow" width="660" height="440">
    <defs>
      <linearGradient id="flow" x1="258" y1="0" x2="404" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#14b8a6"/>
        <stop offset="1" stop-color="#7c5cff"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <path d="M 262 214 Q 330 164 396 212" fill="none" stroke="url(#flow)" stroke-width="10" stroke-linecap="round" opacity="0.14" filter="url(#glow)"/>
    <path d="M 262 214 Q 330 164 390 208" fill="none" stroke="url(#flow)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.1 11" filter="url(#glow)"/>
    <path d="M 392.5 199.5 L 400 215.5 L 382.5 213" fill="none" stroke="#7c5cff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </svg>

  <div class="hint">
    The first time, <span class="key">right-click</span> Isola and choose <b>Open</b>
  </div>
</body>
</html>
